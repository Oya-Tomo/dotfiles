# tmux configuration - managed by dotfiles

# --- Prefix ---------------------------------------------------------------
# Ctrl+b is taken by the terminal emulators (previous pane), so use Ctrl+t.
unbind C-b
set -g prefix C-t
bind C-t send-prefix

# --- General --------------------------------------------------------------
set -g default-terminal "tmux-256color"
# Truecolor and undercurl for Neovim inside tmux.
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",*256col*:Smulx=\\E[4::%p1%dm"
set -ga terminal-overrides ",*256col*:Setulc=\\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"

set -g mouse on
set -g history-limit 100000
set -g display-time 2000
set -g focus-events on
# Keep Neovim's Esc responsive.
set -sg escape-time 10

# Number windows and panes from 1 and keep the numbering gapless.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g mode-keys vi
set -g status-keys emacs

# --- Reload ---------------------------------------------------------------
bind r source-file "${HOME}/.config/tmux/tmux.conf" \; display-message "tmux.conf reloaded"

# --- Panes ----------------------------------------------------------------
# Mirrors the terminal emulators: h splits left/right, v splits top/bottom.
bind h split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
bind q confirm-before -p "kill pane #P? (y/n)" kill-pane
bind Space display-panes

bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind z resize-pane -Z

# --- Windows --------------------------------------------------------------
bind t new-window -c "#{pane_current_path}"
bind Q confirm-before -p "kill window #W? (y/n)" kill-window
bind -r b previous-window
bind -r n next-window
bind -r B swap-window -t -1 \; previous-window
bind -r N swap-window -t +1 \; next-window

# --- Sessions -------------------------------------------------------------
bind s choose-tree -Zs
bind d detach-client

# --- Copy mode ------------------------------------------------------------
# xclip is provided by the Home Manager package set.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind p paste-buffer -p

# --- Appearance (Kanagawa Wave) -------------------------------------------
# Palette: https://github.com/rebelot/kanagawa.nvim
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#16161d,fg=#dcd7ba"

set -g status-left-length 40
set -g status-left "#[bg=#7e9cd8,fg=#16161d,bold] #S #[bg=#16161d,fg=#7e9cd8,nobold] "

set -g status-right-length 60
set -g status-right "#[fg=#727169]#{?client_prefix,#[fg=#c0a36e]^T ,}#[fg=#727169]#H #[fg=#54546d]| #[fg=#938aa9]%Y-%m-%d %H:%M "

setw -g window-status-format "#[fg=#727169] #I:#W#{?window_zoomed_flag, ,} "
setw -g window-status-current-format "#[bg=#2d4f67,fg=#dcd7ba,bold] #I:#W#{?window_zoomed_flag, ,} "
setw -g window-status-activity-style "fg=#c0a36e"
set -g window-status-separator ""

set -g pane-border-style "fg=#54546d"
set -g pane-active-border-style "fg=#7e9cd8"
set -g message-style "bg=#c0a36e,fg=#16161d"
set -g message-command-style "bg=#c0a36e,fg=#16161d"
set -g mode-style "bg=#2d4f67,fg=#dcd7ba"
