"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:#333344)\
$time\
[ ](fg:#333344 bg:#444455)\
$directory\
[ ](fg:#444455)\
\n\
$character
"""

right_format = '$status $git_branch $battery ${custom.ssh-detect}'

[character]
success_symbol = '[>>>](bold yellow)'
error_symbol = '[>>>](bold yellow)'

[battery]
disabled = false
format = '[$percentage $symbol](fg:#999999)'

[[battery.display]]
threshold = 100
charging_symbol = '[󰂄](fg:#999999)'
discharging_symbol = '[󰁹](fg:#999999)'

[[battery.display]]
threshold = 50
charging_symbol = '[󰂄](fg:#999999)'
discharging_symbol = '[󰁽](fg:#999999)'

[[battery.display]]
threshold = 30
discharging_symbol = '[charge battery 󰁺](fg:yellow)'

[[battery.display]]
threshold = 15
discharging_symbol = '[charge battery soon 󰁺](fg:red)'

[directory]
style = 'fg:yellow bg:#444455'
format = '[$path]($style)'
truncation_length = 1
truncation_symbol = '…/'

[git_branch]
style = 'fg:#999999'
symbol = ''
format = '[$branch $symbol]($style)'

[status]
style = 'fg:red'
success_style = 'fg:green'
format = '[$symbol]($style)'
symbol = '✕'
success_symbol = '◯'
disabled=false

[time]
disabled = false
time_format = "%R" # Hour:Minute
format = '[](fg:yellow bg:#333344)[ $time ](fg:#aaaaaa bg:#333344)'

[custom.ssh-detect]
when = 'test -n "$SSH_CONNECTION"'
format = '🌐'

